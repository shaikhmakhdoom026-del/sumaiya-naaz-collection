
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8eee9">
<title>Sumaiya Naaz Collection | New Market</title>
<meta name="description" content="Discover beautiful Sharara designs at Sumaiya Naaz Collection, New Market.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#fffaf7;color:#49352f}
header{background:#f5e7e0;text-align:center;padding:24px 12px 16px}
header h1{font-family:Georgia,serif;font-size:clamp(23px,5vw,36px);letter-spacing:2px}
header p{margin-top:8px;letter-spacing:4px;font-size:12px;color:#866b61}
nav{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff}
nav a,nav button{border:0;background:none;color:#594139;text-decoration:none;font-size:14px;cursor:pointer}
.hero{padding:35px 15px;text-align:center;background:linear-gradient(130deg,#f8e9e5,#fff8f2)}
.hero h2{font:30px Georgia,serif;margin-bottom:12px}
.hero p{font-size:14px;color:#80675e}
.section{padding:28px 16px;max-width:1100px;margin:auto}
.section h2{text-align:center;font:27px Georgia,serif;margin-bottom:10px}
.section .sub{text-align:center;color:#8b7167;font-size:13px;margin-bottom:25px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.product{background:white;border-radius:9px;overflow:hidden;box-shadow:0 3px 15px #68483b12;cursor:pointer}
.product img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.product-info{padding:12px}
.product-info h3{font:17px Georgia,serif}
.product-info p{font-size:12px;color:#8b7167;margin-top:6px}
.product-info button,.main-btn{margin-top:12px;padding:11px 14px;background:#81594e;color:white;border:0;border-radius:5px;cursor:pointer}
.product-info button{width:100%}
footer{background:#f5e7e0;padding:25px;text-align:center;font:20px Georgia,serif}
footer p{font:12px Arial;margin-top:9px}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:10;overflow:auto;padding:20px}
.modal{background:white;border-radius:12px;padding:18px;max-width:500px;margin:30px auto;position:relative}
.close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:26px;cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0}
.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:5px}
.modal h2{font:24px Georgia,serif;margin-bottom:10px}
.modal p{color:#76645c;font-size:14px;line-height:1.6}
.modal button,.cart button{padding:11px;background:#81594e;color:white;border:0;border-radius:5px;cursor:pointer}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:12px 0;font-size:14px}
.cart-item button{padding:5px 9px}
#cartCount{background:#81594e;color:white;border-radius:20px;padding:3px 7px}
.empty{text-align:center;color:#888;padding:25px}
@media(min-width:650px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding:65px 15px}}
</style>
</head>

<body>

<header>
<h1>SUMAIYA NAAZ COLLECTION</h1>
<p>NEW MARKET</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#collection">Sharara Collection</a>
<button onclick="openCart()">My Cart <span id="cartCount">0</span></button>
</nav>

<section class="hero" id="home">
<h2>Elegance in Every Design</h2>
<p>Discover our beautiful Sharara Collection</p>
</section>

<section class="section" id="collection">
<h2>Our Sharara Collection</h2>
<p class="sub">Explore our latest designs</p>
<div class="products" id="products"></div>
</section>

<footer>
SUMAIYA NAAZ COLLECTION
<p>NEW MARKET · Thank you for visiting us</p>
</footer>

<!-- PRODUCT POPUP -->
<div class="overlay" id="productOverlay" onclick="outsideClose(event,'productOverlay')">
<div class="modal">
<button class="close" onclick="closePopup()">×</button>
<div class="gallery" id="gallery"></div>
<h2 id="productName"></h2>
<p id="productDescription"></p>
<button class="main-btn" onclick="addCurrentProduct()">Add to Cart</button>
</div>
</div>

<!-- CART POPUP -->
<div class="overlay" id="cartOverlay" onclick="outsideClose(event,'cartOverlay')">
<div class="modal cart">
<button class="close" onclick="closeCart()">×</button>
<h2>My Shopping Cart</h2>
<div id="cartItems"></div>
<button class="main-btn" onclick="sendOrder()">Order on WhatsApp</button>
</div>
</div>

<script>
const products = [
{
 id:1,
 name:"Sharara Design 001",
 description:"Beautiful Sharara design. Contact us on WhatsApp for product details and availability.",
 photos:[
 "https://placehold.co/500x650/f3d9df/63464e?text=Design+001+Photo+1",
 "https://placehold.co/500x650/ead5df/63464e?text=Design+001+Photo+2",
 "https://placehold.co/500x650/f0e1dc/63464e?text=Design+001+Photo+3"
 ]
},
{
 id:2,
 name:"Sharara Design 002",
 description:"Elegant Sharara design. Contact us on WhatsApp for product details and availability.",
 photos:[
 "https://placehold.co/500x650/e2d6ed/63464e?text=Design+002+Photo+1",
 "https://placehold.co/500x650/eadde8/63464e?text=Design+002+Photo+2",
 "https://placehold.co/500x650/f0e1dc/63464e?text=Design+002+Photo+3"
 ]
},
{
 id:3,
 name:"Sharara Design 003",
 description:"Traditional Sharara design. Contact us on WhatsApp for product details and availability.",
 photos:[
 "https://placehold.co/500x650/e9d8c8/63464e?text=Design+003+Photo+1",
 "https://placehold.co/500x650/eddfd4/63464e?text=Design+003+Photo+2",
 "https://placehold.co/500x650/f0e1dc/63464e?text=Design+003+Photo+3"
 ]
},
{
 id:4,
 name:"Sharara Design 004",
 description:"Stylish Sharara design. Contact us on WhatsApp for product details and availability.",
 photos:[
 "https://placehold.co/500x650/d9e5e3/63464e?text=Design+004+Photo+1",
 "https://placehold.co/500x650/e2e9e4/63464e?text=Design+004+Photo+2",
 "https://placehold.co/500x650/f0e1dc/63464e?text=Design+004+Photo+3"
 ]
}
];

let selectedProduct=null;
let cart={};

function renderProducts(){
 document.getElementById("products").innerHTML=products.map(p=>`
 <article class="product" onclick="showProduct(${p.id})">
 <img src="${p.photos[0]}" alt="${p.name}" loading="lazy">
 <div class="product-info">
 <h3>${p.name}</h3>
 <p>View three photos and description</p>
 <button type="button">View Design</button>
 </div>
 </article>`).join("");
}

function showProduct(id){
 selectedProduct=products.find(p=>p.id===id);
 if(!selectedProduct)return;
 document.getElementById("productName").textContent=selectedProduct.name;
 document.getElementById("productDescription").textContent=selectedProduct.description;
 document.getElementById("gallery").innerHTML=selectedProduct.photos.map((photo,i)=>`
 <img src="${photo}" alt="${selectedProduct.name} photo ${i+1}">`).join("");
 document.getElementById("productOverlay").style.display="block";
}

function closePopup(){
 document.getElementById("productOverlay").style.display="none";
}

function addCurrentProduct(){
 if(!selectedProduct)return;
 cart[selectedProduct.id]=(cart[selectedProduct.id]||0)+1;
 updateCart();
 closePopup();
 alert("Product added to your cart!");
}

function updateCart(){
 const items=Object.entries(cart);
 document.getElementById("cartCount").textContent=items.reduce((sum,[id,qty])=>sum+qty,0);
 document.getElementById("cartItems").innerHTML=items.length?items.map(([id,qty])=>{
 const p=products.find(x=>x.id===Number(id));
 return `<div class="cart-item">
 <span>${p.name}</span>
 <span>
 <button onclick="changeQty(${id},-1)">−</button>
 ${qty}
 <button onclick="changeQty(${id},1)">+</button>
 </span>
 </div>`;
 }).join(""):'<p class="empty">Your cart is empty.</p>';
}

function changeQty(id,amount){
 cart[id]=(cart[id]||0)+amount;
 if(cart[id]<=0)delete cart[id];
 updateCart();
}

function openCart(){
 updateCart();
 document.getElementById("cartOverlay").style.display="block";
}

function closeCart(){
 document.getElementById("cartOverlay").style.display="none";
}

function outsideClose(event,id){
 if(event.target.id===id){
 document.getElementById(id).style.display="none";
 }
}

function sendOrder(){
 const items=Object.entries(cart);
 if(!items.length){
 alert("Please add a product first.");
 return;
 }
 const lines=items.map(([id,qty])=>{
 const p=products.find(x=>x.id===Number(id));
 return p.name+" x "+qty;
 });
 const message="Hello Sumaiya Naaz Collection! I want to order:\n"+lines.join("\n");
 const phone=""; // Add your WhatsApp number with country code, digits only.
 if(!phone){
 alert("WhatsApp number will be connected in the next setup step.");
 return;
 }
 window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(message),"_blank");
}

renderProducts();
updateCart();
</script>
</body>
</html>
